name: Sync OpenAlex Publications

on:
  schedule:
    - cron: '29 18 * * *'  # 11:59 PM Sri Lanka time (UTC+5:30 = UTC 18:29)
  workflow_dispatch:        # manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync OpenAlex data
        run: |
          python3 - << 'EOF'
          import json, urllib.request, time, os
          from datetime import datetime, timezone

          API_KEY = 'w0kxNmNub5piF2PcfVwHpd'
          MEMBERS_FILE = 'data/members.json'

          with open(MEMBERS_FILE, 'r') as f:
              members = json.load(f)

          def fetch_openalex(url, retries=3):
              for i in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'SLIIT-KandyUni-Research/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read())
                  except Exception as e:
                      if i < retries - 1:
                          time.sleep(5 * (i + 1))
                      else:
                          print(f"  Failed: {e}")
                          return None

          updated = 0
          for m in members:
              oa_id = m.get('openalex_id')
              if not oa_id:
                  continue

              print(f"Syncing {m['name']} ({oa_id})...")

              # Fetch author profile
              url = f"https://api.openalex.org/authors/{oa_id}?api_key={API_KEY}"
              data = fetch_openalex(url)

              if data:
                  m['works_count']     = data.get('works_count', 0)
                  m['cited_by_count']  = data.get('cited_by_count', 0)
                  m['h_index']         = data.get('summary_stats', {}).get('h_index', None)
                  m['last_synced']     = datetime.now(timezone.utc).isoformat()
                  updated += 1
                  print(f"  works={m['works_count']} citations={m['cited_by_count']} h={m['h_index']}")
              else:
                  print(f"  Skipped (fetch failed)")

              time.sleep(0.5)  # polite delay

          # Save last_sync_time at top level
          sync_meta = {
              'last_sync': datetime.now(timezone.utc).isoformat(),
              'updated_count': updated
          }

          with open(MEMBERS_FILE, 'w') as f:
              json.dump(members, f, indent=2, ensure_ascii=False)

          with open('data/sync_meta.json', 'w') as f:
              json.dump(sync_meta, f, indent=2)

          print(f"\nDone. Updated {updated} members.")
          EOF

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/members.json data/sync_meta.json
          git diff --staged --quiet || git commit -m "chore: auto-sync OpenAlex data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Publications — SLIIT KandyUni</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f8f7f5;--surface:#fff;--border:#e2e0db;--fg:#1a1917;--fg-muted:#6b6762;--accent:#2563eb;--accent-soft:#dbeafe;--tag-bg:#f1f0ee;--journal:#065f46;--journal-bg:#d1fae5;--conf:#7c3aed;--conf-bg:#ede9fe;}
@media(prefers-color-scheme:dark){:root{--bg:#111110;--surface:#1c1b19;--border:#2e2d2a;--fg:#f0ede8;--fg-muted:#888480;--accent:#60a5fa;--accent-soft:#1e3a5f;--tag-bg:#252420;--journal:#34d399;--journal-bg:#064e3b;--conf:#a78bfa;--conf-bg:#3b1f6e;}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.6;}
a{color:inherit;text-decoration:none;}
.site-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px;}
.site-title{font-size:1rem;font-weight:700;}
.site-title span{color:var(--fg-muted);font-weight:400;}
.header-nav{display:flex;gap:8px;align-items:center;}
.nav-link{font-size:.85rem;color:var(--fg-muted);padding:6px 12px;border-radius:6px;transition:background .15s,color .15s;}
.nav-link:hover{background:var(--tag-bg);color:var(--fg);}
.admin-link{background:var(--accent);color:#fff!important;font-weight:600;padding:6px 14px;border-radius:6px;}
.admin-link:hover{opacity:.85;background:var(--accent);}
.hero{background:var(--surface);border-bottom:1px solid var(--border);padding:40px 24px;}
.hero-inner{max-width:1100px;margin:0 auto;}
.hero h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;}
.hero p{color:var(--fg-muted);margin-top:6px;}
.tab-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;}
.tab-inner{max-width:1100px;margin:0 auto;display:flex;gap:4px;}
.tab{padding:12px 18px;font-size:.88rem;font-weight:600;color:var(--fg-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;}
.tab:hover{color:var(--fg);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.content-wrap{max-width:1100px;margin:0 auto;padding:0 24px 48px;}
.stats-bar{display:flex;gap:24px;font-size:.85rem;color:var(--fg-muted);padding:20px 0 8px;}
.stats-bar strong{color:var(--fg);}
.search-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.search-input{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:.9rem;color:var(--fg);outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--accent);}
.search-input::placeholder{color:var(--fg-muted);}
.filter-select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:.85rem;color:var(--fg);cursor:pointer;outline:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.member-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s;cursor:pointer;}
.member-card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(37,99,235,.08);}
.member-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:700;color:var(--accent);}
.member-name{font-weight:600;font-size:1rem;}
.member-title{font-size:.82rem;color:var(--fg-muted);}
.member-dept{font-size:.78rem;background:var(--tag-bg);padding:3px 8px;border-radius:5px;display:inline-block;color:var(--fg-muted);}
.member-stats{display:flex;gap:12px;margin-top:4px;}
.stat{font-size:.8rem;color:var(--fg-muted);}
.stat strong{color:var(--fg);font-weight:600;}
.member-footer{margin-top:4px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.view-btn{font-size:.8rem;color:var(--accent);font-weight:600;}
.sync-badge{font-size:.72rem;color:var(--fg-muted);}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 24px;color:var(--fg-muted);}
.empty-state h2{font-size:1.1rem;margin-bottom:8px;color:var(--fg);}
.group-header{grid-column:1/-1;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-muted);padding:16px 0 6px;border-top:1px solid var(--border);margin-top:8px;}
.group-header:first-child{border-top:none;margin-top:0;padding-top:4px;}
.group-count{background:var(--tag-bg);border-radius:10px;padding:1px 8px;font-size:.75rem;font-weight:600;color:var(--fg-muted);margin-left:6px;text-transform:none;letter-spacing:0;}
.year-section{margin-top:28px;}
.year-heading{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border);}
.year-label{font-size:1.3rem;font-weight:700;}
.year-pill{font-size:.78rem;background:var(--tag-bg);padding:3px 10px;border-radius:12px;color:var(--fg-muted);}
.year-pill-j{font-size:.78rem;background:var(--journal-bg);color:var(--journal);padding:3px 10px;border-radius:12px;font-weight:600;}
.year-pill-c{font-size:.78rem;background:var(--conf-bg);color:var(--conf);padding:3px 10px;border-radius:12px;font-weight:600;}
.year-pub-list{display:flex;flex-direction:column;gap:10px;}
.ypub-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;}
.ypub-title{font-weight:600;font-size:.9rem;line-height:1.35;}
.ypub-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.type-badge-j{font-size:.75rem;background:var(--journal-bg);color:var(--journal);padding:2px 8px;border-radius:5px;font-weight:600;}
.type-badge-c{font-size:.75rem;background:var(--conf-bg);color:var(--conf);padding:2px 8px;border-radius:5px;font-weight:600;}
.ypub-venue{font-size:.8rem;color:var(--fg-muted);font-style:italic;}
.ypub-authors{font-size:.78rem;color:var(--fg-muted);}
.ypub-doi{font-size:.75rem;color:var(--accent);}
.spinner-inline{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:600px){.header-nav .nav-link:not(.admin-link){display:none;}.hero h1{font-size:1.3rem;}.tab-inner{overflow-x:auto;}.stats-bar{flex-wrap:wrap;gap:12px;}}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="site-title">SLIIT KandyUni <span>Research Publications</span></div>
    <nav class="header-nav"><a class="nav-link admin-link" href="admin.html">Admin</a></nav>
  </div>
</header>
<div class="hero"><div class="hero-inner"><h1>Research Publications</h1><p>Journal articles and conference papers by SLIIT KandyUni staff, via OpenAlex.</p></div></div>
<div class="tab-wrap"><div class="tab-inner">
  <div class="tab active" id="tab-staff" onclick="switchTab('staff')">By Staff</div>
  <div class="tab" id="tab-year" onclick="switchTab('year')">By Year</div>
</div></div>
<div class="content-wrap">
  <div class="stats-bar" id="statsBar"></div>
  <div id="staffControls">
    <div class="search-row">
      <input class="search-input" id="searchInput" type="text" placeholder="Search by name or department…" oninput="filterMembers()">
      <select class="filter-select" id="deptFilter" onchange="filterMembers()"><option value="">All Departments</option></select>
    </div>
    <div class="grid" id="memberGrid"></div>
  </div>
  <div id="yearTab" style="display:none"><div id="yearContent"><p style="color:var(--fg-muted);padding:20px 0">Loading publication data…</p></div></div>
</div>
<script>
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let members=[],currentTab='staff',yearDataLoaded=false;
async function loadMembers(){try{const r=await fetch('data/members.json?_='+Date.now());members=await r.json();}catch(e){members=[];}renderDeptFilter();filterMembers();updateStatsBar();}
function renderDeptFilter(){const sel=document.getElementById('deptFilter');const depts=[...new Set(members.map(m=>m.department).filter(Boolean))].sort();depts.forEach(d=>{const opt=document.createElement('option');opt.value=d;opt.textContent=d;sel.appendChild(opt);});}
function updateStatsBar(){const bar=document.getElementById('statsBar');const totalPubs=members.reduce((s,m)=>s+(m.works_count||0),0);const totalCites=members.reduce((s,m)=>s+(m.cited_by_count||0),0);bar.innerHTML=`<span><strong>${members.length}</strong> staff members</span><span><strong>${totalPubs.toLocaleString()}</strong> journal &amp; conference papers</span><span><strong>${totalCites.toLocaleString()}</strong> total citations</span>`;}
function filterMembers(){const q=document.getElementById('searchInput').value.toLowerCase();const dept=document.getElementById('deptFilter').value;const filtered=members.filter(m=>{const matchQ=!q||m.name.toLowerCase().includes(q)||(m.department||'').toLowerCase().includes(q);const matchD=!dept||m.department===dept;return matchQ&&matchD;});renderGrid(filtered);}
function initials(name){return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function timeAgo(iso){if(!iso)return'Never synced';const d=Math.floor((Date.now()-new Date(iso))/86400000);if(d===0)return'Synced today';if(d===1)return'Synced yesterday';return`Synced ${d}d ago`;}
const POSITION_ORDER=['Assistant Professor','Lecturer','Assistant Lecturer','Instructor'];
function memberCard(m){const hasData=m.openalex_id;return`<div class="member-card" onclick="${hasData?`location.href='member.html?id=${m.id}'`:''}"><div class="member-avatar">${initials(m.name)}</div><div><div class="member-name">${esc(m.name)}</div><div class="member-title">${esc(m.title||'')}</div></div>${m.department?`<span class="member-dept">${esc(m.department)}</span>`:''}<div class="member-stats">${hasData?`<div class="stat"><strong>${(m.works_count||0).toLocaleString()}</strong> papers</div><div class="stat"><strong>${(m.cited_by_count||0).toLocaleString()}</strong> citations</div>${m.h_index!=null?`<div class="stat"><strong>${m.h_index}</strong> h-index</div>`:''}` :`<div class="stat" style="color:var(--fg-muted);font-size:.8rem">No publications data</div>`}</div><div class="member-footer">${hasData?`<span class="view-btn">View publications →</span>`:'<span></span>'}<span class="sync-badge">${timeAgo(m.last_synced)}</span></div></div>`;}
function renderGrid(list){const grid=document.getElementById('memberGrid');if(!list.length){grid.innerHTML=`<div class="empty-state"><h2>No staff members found</h2><p>Try a different search or add members via the admin panel.</p></div>`;return;}const groups={};list.forEach(m=>{const pos=m.title||'Other';if(!groups[pos])groups[pos]=[];groups[pos].push(m);});const ordered=POSITION_ORDER.filter(p=>groups[p]).concat(Object.keys(groups).filter(p=>!POSITION_ORDER.includes(p)));grid.innerHTML=ordered.map(pos=>`<div class="group-header">${esc(pos)}s <span class="group-count">${groups[pos].length}</span></div>${groups[pos].map(memberCard).join('')}`).join('');}
function switchTab(tab){currentTab=tab;document.getElementById('tab-staff').classList.toggle('active',tab==='staff');document.getElementById('tab-year').classList.toggle('active',tab==='year');document.getElementById('staffControls').style.display=tab==='staff'?'':'none';document.getElementById('yearTab').style.display=tab==='year'?'':'none';if(tab==='year'&&!yearDataLoaded)loadYearView();}
async function loadYearView(){
  yearDataLoaded=true;
  const container=document.getElementById('yearContent');
  container.innerHTML=`<p style="color:var(--fg-muted);padding:16px 0">Fetching publications from OpenAlex… <span class="spinner-inline"></span></p>`;
  let allWorks=[];
  const withId=members.filter(m=>m.openalex_id);
  for(let i=0;i<withId.length;i++){
    const m=withId[i];
    container.innerHTML=`<p style="color:var(--fg-muted);padding:16px 0">Fetching publications… (${i+1}/${withId.length}: ${m.name}) <span class="spinner-inline"></span></p>`;
    try{const works=await fetchMemberWorks(m.openalex_id,m.name);allWorks=allWorks.concat(works);}catch(e){}
    if(i<withId.length-1)await new Promise(r=>setTimeout(r,500));
  }
  if(!allWorks.length){container.innerHTML=`<p style="color:var(--fg-muted);padding:20px 0">No publications found.</p>`;return;}
  const seen=new Set();
  allWorks=allWorks.filter(w=>{if(seen.has(w.id))return false;seen.add(w.id);return true;});
  const byYear={};
  allWorks.forEach(w=>{const y=w.publication_year||'Unknown';if(!byYear[y])byYear[y]=[];byYear[y].push(w);});
  const years=Object.keys(byYear).sort((a,b)=>b-a);
  const html=years.map(y=>{const pubs=byYear[y].sort((a,b)=>(b.cited_by_count||0)-(a.cited_by_count||0));const jCount=pubs.filter(w=>classifyWork(w)==='journal').length;const cCount=pubs.filter(w=>classifyWork(w)==='conference').length;return`<div class="year-section"><div class="year-heading"><span class="year-label">${esc(String(y))}</span><span class="year-pill">${pubs.length} paper${pubs.length>1?'s':''}</span>${jCount?`<span class="year-pill-j">${jCount} journal</span>`:''} ${cCount?`<span class="year-pill-c">${cCount} conference</span>`:''}</div><div class="year-pub-list">${pubs.map(w=>yearPubCard(w)).join('')}</div></div>`;}).join('');
  container.innerHTML=`<p style="font-size:.85rem;color:var(--fg-muted);padding:12px 0 4px">${allWorks.length} unique papers across ${years.length} years.</p>${html}`;
}
async function fetchMemberWorks(oaId){
  const url=`https://api.openalex.org/works?filter=author.id:${oaId}&per-page=100&select=id,display_name,publication_year,type,primary_location,cited_by_count,doi,authorships,biblio,open_access&mailto=research@sliit.lk`;
  let page=1,results=[];
  while(true){
    let r;
    for(let attempt=0;attempt<3;attempt++){r=await fetch(`${url}&page=${page}`);if(r.status===429)await new Promise(res=>setTimeout(res,2000*(attempt+1)));else break;}
    if(!r.ok)break;
    const data=await r.json();
    results=results.concat(data.results||[]);
    if(results.length>=(data.meta?.count||0)||!(data.results?.length))break;
    page++;if(page>10)break;
    await new Promise(res=>setTimeout(res,300));
  }
  return results;
}
function classifyWork(w){const t=(w.type||'').toLowerCase();if(t==='journal-article'||t==='article')return'journal';if(t==='proceedings-article'||t==='conference-paper')return'conference';return'other';}
function yearPubCard(w){const cat=classifyWork(w);const badge=cat==='journal'?`<span class="type-badge-j">Journal</span>`:`<span class="type-badge-c">Conference</span>`;const venue=w.primary_location?.source?.display_name;const oa=w.open_access?.is_oa;const authors=(w.authorships||[]).slice(0,4).map(a=>a.author?.display_name).filter(Boolean).join(', ')+((w.authorships||[]).length>4?' et al.':'');const doi=w.doi;return`<div class="ypub-card"><div class="ypub-title">${esc(w.display_name||'Untitled')}</div><div class="ypub-meta">${badge}${oa?'<span style="font-size:.75rem;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:5px;font-weight:600">OA</span>':''}${(w.cited_by_count||0)>0?`<span style="font-size:.75rem;color:var(--fg-muted)">${w.cited_by_count} citations</span>`:''}${doi?`<a class="ypub-doi" href="${esc(doi)}" target="_blank" rel="noopener">DOI ↗</a>`:''}</div>${venue?`<div class="ypub-venue">${esc(venue)}</div>`:''}${authors?`<div class="ypub-authors">${esc(authors)}</div>`:''}</div>`;}
loadMembers();
</script>
</body>
</html>
